name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: 构建发布包
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 获取版本号
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "发布版本: $VERSION"

      - name: Shell 语法检查
        run: |
          sudo apt-get install -y shellcheck
          find . -name "*.sh" -type f | while read -r file; do
            shellcheck -e SC1091,SC2034 "$file" || exit 1
          done

      - name: 打包发布文件
        run: |
          VERSION=${{ steps.version.outputs.version }}
          RELEASE_DIR="linux-deploy-${VERSION}"
          
          mkdir -p "$RELEASE_DIR/scripts"
          
          # 复制主要文件
          cp install.sh "$RELEASE_DIR/"
          cp README.md "$RELEASE_DIR/"
          cp LICENSE "$RELEASE_DIR/" 2>/dev/null || true
          cp scripts/*.sh "$RELEASE_DIR/scripts/"
          cp scripts/packages.txt "$RELEASE_DIR/scripts/"
          
          # 创建压缩包
          tar -czvf "linux-deploy-${VERSION}.tar.gz" "$RELEASE_DIR"
          zip -r "linux-deploy-${VERSION}.zip" "$RELEASE_DIR"
          
          echo "✓ 打包完成"
          ls -la linux-deploy-${VERSION}.*

      - name: 生成更新日志
        run: |
          VERSION=${{ steps.version.outputs.version }}
          echo "# Linux Deploy $VERSION" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "## 更新内容" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          # 获取 tag 的 message
          git tag -l --format='%(contents)' "$VERSION" >> CHANGELOG.md || echo "- 版本更新" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "## 安装方式" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo '```bash' >> CHANGELOG.md
          echo "curl -fsSL \"https://gitee.com/jacob_ng/linux-deploy/raw/${VERSION}/install.sh\" | bash -s ${VERSION}" >> CHANGELOG.md
          echo '```' >> CHANGELOG.md
          
          cat CHANGELOG.md

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.version }}
          path: |
            linux-deploy-*.tar.gz
            linux-deploy-*.zip
            CHANGELOG.md
          retention-days: 30

  release:
    name: 创建 Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.build.outputs.version }}

      - name: 发布通知
        run: |
          echo "==================================="
          echo "  ✓ Release 构建完成"
          echo "  版本: ${GITHUB_REF#refs/tags/}"
          echo "  时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "==================================="
          echo ""
          echo "请手动到 Gitee 创建 Release 并上传以下文件:"
          ls -la linux-deploy-*.* 2>/dev/null || echo "(产物在 artifact 中)"
